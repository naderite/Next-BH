name: Housing runtime

on:
  pull_request:
    paths:
      - 'mvp/**'
      - '.github/workflows/housing-runtime.yml'
  push:
    branches: [master]
    paths:
      - 'mvp/**'
      - '.github/workflows/housing-runtime.yml'

permissions:
  contents: read

jobs:
  housing-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r mvp/requirements.txt httpx==0.28.1
      - run: python -m pip check
      - run: python -m unittest -v mvp.test_housing
