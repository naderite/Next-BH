name: Housing runtime

on:
  pull_request:
    paths:
      - 'mvp/**'
      - '.github/workflows/housing-runtime.yml'
  push:
    branches: [master]
    paths:
      - 'mvp/**'
      - '.github/workflows/housing-runtime.yml'

permissions:
  contents: read

jobs:
  housing-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r mvp/requirements.txt httpx==0.28.1
      - run: python -m pip check
      - run: python -m unittest -v mvp.test_housing

  housing-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r mvp/policy-requirements.txt httpx==0.28.1
      - run: python -m pip check
      - run: python -m mvp.train_policy --output "$RUNNER_TEMP/housing-policy.zip" --steps 256
      - name: Load the checkpoint and make a masked decision
        run: NEXT_BH_TEST_CHECKPOINT="$RUNNER_TEMP/housing-policy.zip" python -m unittest -v mvp.test_housing.HousingTest.test_trained_checkpoint_decides_in_the_runtime
